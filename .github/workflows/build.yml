# Builds the Android APK and the Mac app on every push to main,
# then publishes both as a GitHub Release (Releases section of the repo).
name: Build ClipBridge
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK (runner ships with the Android SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../ClipBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-android
          path: ClipBridge.apk

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - name: Build universal binary (Apple Silicon + Intel)
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Package ClipBridge.app
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/ClipBridge"
          APP=build/ClipBridge.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/ClipBridge"
          cp Info.plist "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" ../ClipBridge-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-mac
          path: ClipBridge-mac.zip

  release:
    needs: [android, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ClipBridge v1.0.${{ github.run_number }}
          body: |
            **Android:** download `ClipBridge.apk` on your phone and install it.
            **Mac:** download `ClipBridge-mac.zip`, unzip, move `ClipBridge.app` to Applications, then run once in Terminal:
            `xattr -dr com.apple.quarantine /Applications/ClipBridge.app && open /Applications/ClipBridge.app`
          files: |
            ClipBridge.apk
            ClipBridge-mac.zip
